name: CI

on:
  push:
    branches: [dev-work, main]
  pull_request:
    branches: [dev-work, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DEEPSEEK_API_KEY: ci-dummy
          JWT_SECRET: ci-dummy-secret-not-for-production
          PORTAL_SECRET: ci-dummy
          WECOM_WEBHOOK_URL: ''
